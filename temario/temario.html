<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temario - ATI 2025</title>
    <link rel="stylesheet" href="../css/temario.css">
</head>
<body>
    <div class="app-container">
        <header class="top-bar">
            <h1 id="titulo-temario">Temario</h1>
            <div class="top-bar-derecha">
                <input type="search" id="buscador" placeholder="Buscar tema...">
                <button type="button" id="btn-exportar" title="Guardar en un archivo las preguntas asociadas a cada tema">Exportar asociaciones</button>
                <button type="button" id="btn-importar">Importar</button>
                <input type="file" id="archivo-importar" accept=".json" hidden>
            </div>
        </header>

        <div class="main-layout">
            <nav id="indice" class="indice"></nav>

            <div class="contenido-panel">
                <article id="contenido" class="contenido">
                    <p class="aviso">Cargando temario...</p>
                </article>
                <div class="bottom-bar">
                    <button id="btn-anterior" type="button">◀ Anterior</button>
                    <span id="posicion"></span>
                    <button id="btn-siguiente" type="button">Siguiente ▶</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Librerías de Markdown: si no cargan, se muestra texto plano -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="../js/temario.js"></script>
</body>
</html>
